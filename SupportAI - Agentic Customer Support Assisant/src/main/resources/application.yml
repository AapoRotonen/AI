spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: supportai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportai}
    username: ${DB_USERNAME:supportai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:supportai-disabled}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    tools:
      throw-exception-on-error: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

supportai:
  ai:
    api-key: ${OPENAI_API_KEY:supportai-disabled}
  jwt:
    secret: ${JWT_SECRET}
    issuer: supportai
    ttl: PT8H

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.springframework.ai: WARN


info:
  app:
    name: SupportAI
    description: Agentic customer support assistant proof of concept
