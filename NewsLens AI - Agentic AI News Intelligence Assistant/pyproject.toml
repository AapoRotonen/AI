[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "newslens-ai"
version = "0.1.0"
description = "An agentic AI news intelligence assistant for Discord."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.12,<5",
  "discord.py>=2.5,<3",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pgvector>=0.5,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "hatchling==1.32.4",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
newslens = "newslens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["newslens"]

[tool.hatch.build]
exclude = ["/.env", "/.env.*", "/.secrets", "/.uv-cache", "/.venv", "/dist", "/build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
