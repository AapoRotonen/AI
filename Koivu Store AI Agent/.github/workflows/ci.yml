name: deterministic checks

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q main.py agent core tests evals
      - name: Run deterministic tests
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check frontend JavaScript syntax
        run: node --check frontend/store.js
